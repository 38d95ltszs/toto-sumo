name: update sumo torikumi

# 本場所中、ABEMA TIMES「大相撲 取組結果」から幕内の勝敗と翌日の割（前売り用）を
# 自動取得し、data/basho.json の days を更新する（scraper/fetch_torikumi.mjs）。
#   ・JST 19:00 / 20:00 … 当日の勝敗 ＋ 翌日の割
#   ・JST 08:00         … 前日分の取りこぼし回収 ＋ 当日の割
#   ・初日の2日前（金）からは初日の割を取得。場所期間外は何もせず終了する。
# 番付・優勝三賞は引き続き「取組結果登録ツール」で手動登録する（days 以外には触れない）。
# 確定済みの取組結果は上書きしない。解析失敗（ページ仕様変更）やアクセス制限(403/429)の
# ときはジョブが失敗し、GitHubから通知が届く。
#
# 【起動のしくみ】時刻どおりの起動は Supabase の pg_cron が GitHub API で行う（workflow_dispatch）。
#   GitHub Actions の schedule は混雑時に大きく遅れ、2026年11月場所では3〜10時間遅れていた。
#   設定は「取組自動取得_定時実行の設定手順.md」。
# 下の schedule は Supabase 側が止まったときの保険（取得は何度実行しても同じ結果になるので、
# 遅れて重複実行されても害はない）。混雑しやすい毎時0分を避けて17分にしている。
#   UTC 10:17 = JST 19:17 / UTC 11:17 = JST 20:17 / UTC 23:17(前日) = JST 08:17

on:
  workflow_dispatch: {}   # Supabase pg_cron から JST 19:00 / 20:00 / 8:00 に起動
  schedule:
    - cron: "17 10 * * *"   # 保険 JST 19:17
    - cron: "17 11 * * *"   # 保険 JST 20:17
    - cron: "17 23 * * *"   # 保険 JST 08:17

concurrency:
  group: update-sumo-torikumi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  torikumi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch torikumi & commit (最新を取り込んでから days を更新)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            # ニュース自動更新や手動コミットなど最新の変更を取り込んでから実行する
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            node scraper/fetch_torikumi.mjs
            git add data/basho.json
            if git diff --cached --quiet; then
              echo "変更なし。コミットをスキップします。"
              exit 0
            fi
            git commit -m "update torikumi ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push; then exit 0; fi
            echo "push失敗。最新を取り込んで再試行 ($i)"
            git reset --soft HEAD~1
          done
          echo "3回試行しても push できませんでした（次回スケジュールで再取得）。"
